services:
  db:
    image: postgres:15-alpine
    container_name: politracker_db
    environment:
      POSTGRES_USER: politracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-politracker_dev}
      POSTGRES_DB: politracker
    ports:
      # 5433 en el host: el 5432 está ocupado por un PostgreSQL nativo de Windows
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
